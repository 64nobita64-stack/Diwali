<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Happy Diwali ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #1b003a 0%, #050014 70%, #020008 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .wish-container {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.5rem;
            background: linear-gradient(180deg, #fff7ad 0%, #ffa100 50%, #ff4500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.8));
            letter-spacing: 2px;
            animation: pulse 2s infinite alternate;
        }
        p {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            color: #ffd8a8;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            font-weight: 300;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 165, 0, 0.6)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(255, 215, 0, 1)); }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="wish-container">
        <h1>✨ Happy Diwali ✨</h1>
        <p>Tap anywhere for magic</p>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2.8 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.006;
                this.friction = 0.95;
                this.gravity = 0.07;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
        }

        let particles = [];
        const colorPalette = [
            '#ffd700', '#ff3366', '#00e5ff', '#ff9900',
            '#76ff03', '#e040fb', '#ffffff', '#ffab00', '#00ffcc'
        ];

        function triggerScreenWideBursts() {
            const burstCount = 10; 

            for (let b = 0; b < burstCount; b++) {
                setTimeout(() => {
                    const randomX = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                    const randomY = Math.random() * (canvas.height * 0.7) + (canvas.height * 0.1);
                    const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];

                    for (let i = 0; i < 60; i++) {
                        particles.push(new Particle(randomX, randomY, color));
                    }
                }, b * 60);
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 0, 20, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.alpha > 0) {
                    p.update();
                    p.draw();
                } else {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('click', () => {
            triggerScreenWideBursts();
        });

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerScreenWideBursts();
        });

        animate();
    </script>
</body>
</html>
